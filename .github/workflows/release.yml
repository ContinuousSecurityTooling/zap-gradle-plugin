name: Create release
run-name: Release ${{ inputs.release_type == 'custom' && inputs.custom_version || inputs.release_type }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release to build'
        type: choice
        default: patch
        options: [patch, minor, major, custom]
      custom_version:
        description: "Version to release (only used when release_type is 'custom', e.g. 1.2.3)"
        type: string
        required: false

jobs:
  release:
    uses: m13tLabs/gh-actions-templates/.github/workflows/gradle-release.yml@main
    with:
      release_type: ${{ inputs.release_type }}
      custom_version: ${{ inputs.custom_version }}
      client_id: ${{ vars.CI_CLIENT_ID }}
      java_version: '25.0.5+8.0.LTS'
      gradle_tasks: 'publishAndReleaseToMavenCentral publishPlugins'
      gradle_args: '-x test'
    # `secrets: inherit` doesn't cross organizations (template lives in m13tLabs)
    secrets:
      CI_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
      OSS_SONATYPE_USER: ${{ secrets.OSS_SONATYPE_USER }}
      OSS_SONATYPE_PASS: ${{ secrets.OSS_SONATYPE_PASS }}
      OSS_SONATYPE_GPG_PRIVATE_KEY: ${{ secrets.OSS_SONATYPE_GPG_PRIVATE_KEY }}
      OSS_SONATYPE_GPG_PASSPHRASE: ${{ secrets.OSS_SONATYPE_GPG_PASSPHRASE }}
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
