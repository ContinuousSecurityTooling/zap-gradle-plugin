import com.vanniktech.maven.publish.GradlePublishPlugin

plugins {
    id 'com.gradle.plugin-publish' version '2.1.1'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

apply plugin: 'groovy'
apply plugin: 'eclipse'
apply plugin: 'idea'

repositories {
    mavenCentral()
}

group 'net.continuous-security-tools'
version = findProperty('releaseVersion') ?: '0.0.1-SNAPSHOT'

ext.zapJavaVersion = '0.6.0'

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation 'com.google.guava:guava:33.6.0-jre'

    implementation "net.continuous-security-tools:zap-utils:${zapJavaVersion}"
    implementation "net.continuous-security-tools:zap-client-api:${zapJavaVersion}"
    implementation "net.continuous-security-tools:zap-report-parser:${zapJavaVersion}"

    testImplementation gradleTestKit()
    testImplementation 'org.hamcrest:hamcrest-all:1.3'
    testImplementation 'com.netflix.nebula:nebula-test:12.6.0'
    testImplementation 'org.spockframework:spock-core:2.3-groovy-3.0'
    testImplementation 'org.spockframework:spock-junit4:2.3-groovy-3.0'
}

test {
    useJUnitPlatform()
}

mavenPublishing {
    configure(new GradlePublishPlugin())

    coordinates(group.toString(), 'zap-gradle-plugin', version.toString())

    publishToMavenCentral()
    signAllPublications()

    pom {
        name = 'ZAP Gradle Plugin'
        description = 'A Gradle plugin for running OWASP ZAP security scans.'
        url = 'https://github.com/ContinuousSecurityTooling/zap-gradle-plugin'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = 'mreinhardt'
                name = 'Martin Reinhardt'
                email = 'martin@m13t.de'
            }
        }

        scm {
            url = 'https://github.com/ContinuousSecurityTooling/zap-gradle-plugin'
            connection = 'scm:git:git://github.com/ContinuousSecurityTooling/zap-gradle-plugin.git'
            developerConnection = 'scm:git:ssh://git@github.com/ContinuousSecurityTooling/zap-gradle-plugin.git'
        }
    }
}


gradlePlugin {
    website.set('https://github.com/ContinuousSecurityTooling/zap-gradle-plugin')
    vcsUrl.set('https://github.com/ContinuousSecurityTooling/zap-gradle-plugin')
    plugins {
      create("zapPlugin") {
        id = 'net.continuous-security-tools.zap-gradle'
        implementationClass = 'net.continuoussecuritytools.zap.ZapPlugin'
        displayName = 'ZAP Gradle Plugin'
        description = 'A Gradle plugin for running OWASP ZAP security scans.'
        tags.set(['java', 'code quality', 'zap', 'dev ops', 'security'])
      }
    }
}
